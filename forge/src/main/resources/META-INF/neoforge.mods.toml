modLoader = "javafml"
loaderVersion = "[1,)"
license = "LGPL-3.0-only"
issueTrackerURL = "https://github.com/null2264/CobbleGen/issues"

[[mods]]
modId = "cobblegen"
version = "${version}"
displayName = "CobbleGen"
displayURL = "https://github.com/null2264/CobbleGen"
logoFile = "icon.png"
authors = "null2264"
description = "An MC mod that allows you to customize cobblestone (stone and basalt) generators"

[[mixins]]
config = "cobblegen.mixins.json"

[[mixins]]
config = "cobblegen.forge.mixins.json"

[[dependencies.cobblegen]]
modId = "neoforge"
mandatory = true
# This is needed for NeoForge 1.20.4 and newer, replace `mandatory = true`
type = "required"
versionRange = "[1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.cobblegen]]
modId = "minecraft"
mandatory = true
# This is needed for NeoForge 1.20.4 and newer, replace `mandatory = true`
type = "required"
versionRange = "${mcversion}"
ordering = "NONE"
side = "BOTH"

[mc-publish]
modrinth = "qRogT5Gy"
curseforge = 581293
loaders = ["neoforge"]
