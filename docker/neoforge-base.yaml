services:
  mc:
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "1.21.3"
      NEOFORGE_VERSION: "21.3.14-beta"
      MODS: |
        https://cdn.modrinth.com/data/qRogT5Gy/versions/wwzxEHBd/cobblegen-5.3.13%2B1.21.3b49-BETA-neoforge.jar
      ONLINE_MODE: "FALSE"
    volumes:
      - ./neo-data:/data
