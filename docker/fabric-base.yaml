services:
  mc:
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "1.20.1"
      MODS: |
        https://cdn.modrinth.com/data/qRogT5Gy/versions/V9URgvpV/cobblegen-5.4.2%2B1.20.1b1175-BETA-fabric.jar
      ONLINE_MODE: "FALSE"
    volumes:
      - ./fabric-data:/data
