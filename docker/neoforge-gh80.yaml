services:
  mc:
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "21.1.72"
      MODS: |
        https://cdn.modrinth.com/data/qRogT5Gy/versions/Hea09LyB/1.21-neoforge-5.3.10%2B1.21b46-BETA-neoforge.jar
      ONLINE_MODE: "FALSE"
    volumes:
      - ./data:/data
