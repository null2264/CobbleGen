name: Build and Release
on:
  push:
    branches:
      - root
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without "v" prefix)'
        required: true
        type: string
      bypass-test:
        description: 'Disable test'
        default: false
        required: false
        type: boolean
      bypass-mod-publish:
        description: 'Disable publishing the mods to mod hosts (Modrinth, CurseForge)'
        default: true
        required: false
        type: boolean
      target-mc-version:
        default: ''
        description: 'Targetted Minecraft version that will be used as base to build CobbleGen'
        required: false
        type: string
      runtime-mc-version:
        default: ''
        description: 'Minecraft version that will be used to run the test'
        required: false
        type: string

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup matrix
        id: matrix
        run: |
          TARGET="${{ github.event.inputs.target-mc-version }}"
          RUNTIME="${{ github.event.inputs.runtime-mc-version }}"

          if [ "$TARGET" != "" ] && [ "$RUNTIME" != "" ]; then
            MATRIX="$(jq -cr --arg v "$TARGET" --argjson tv "[\"$RUNTIME\"]" '.include |= (map(select(.mc == $v)) | map(.testVersions = $tv))' versions.json)"
          elif [ "$TARGET" != "" ]; then
            MATRIX="$(jq -cr --arg v "$TARGET" '.include |= map(select(.mc == $v))' versions.json)"
          else
            MATRIX="$(jq -cr . ./versions.json)"
          fi

          echo $MATRIX

          # Invalid target version
          [ "$MATRIX" = '{"include":[]}' ] && exit 1

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

      - name: Setup CHANGELOG parser
        uses: taiki-e/install-action@parse-changelog

      - name: Retrieve changelog
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' && github.event.inputs.bypass-mod-publish != 'true'
        id: changelog
        run: |
          # extended SemVer (major.minor.patch.hotfix)
          VERSION_FORMAT='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?(-[0-9A-Za-z\.-]+)?(\+[0-9A-Za-z\.-]+)?$|^Unreleased$'

          CHANGELOG="$(parse-changelog CHANGELOG.md ${{ github.event.inputs.version == '' && 'INVALID' || github.event.inputs.version }} --version-format $VERSION_FORMAT || parse-changelog CHANGELOG.md Unreleased --version-format $VERSION_FORMAT || echo "")"
          [ "$CHANGELOG" = "" ] && exit 1

          {
            echo "changelog<<END_OF_FILE"
            echo "$CHANGELOG"
            echo ""
            echo "END_OF_FILE"
          } >> $GITHUB_OUTPUT 2> /dev/null

      # To reduce api request, so we don't hit rate-limit
      - name: Retrieve JSON
        run: |
          curl -Ls -o "headlessmc.json" "https://api.github.com/repos/3arthqu4ke/headlessmc/releases/tags/3.0.0-RC9" --header "Authorization: ${{ secrets.GITHUB_TOKEN }}"

      - name: Upload jar files
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-kit
          path: |
            headlessmc.json
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Don't cancel if one failed
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

#       - name: Cache build
#         if: github.event.repository != null && github.ref_name == github.event.repository.default_branch
#         uses: actions/cache@v4
#         with:
#           path: cobblegen/build
#           key: build-${{ hashFiles(format('{0}/[a-z]**', 'cobblegen/build'), 'mclib/**') }}-${{ matrix.mc }}-${{ matrix.loader }}

      - name: Setup Gradle
        uses: null2264/actions/gradle-java-setup@bbaccaee5d565520c64f789551504e03ea8c57c6
        with:
          distro: temurin
          java: |
            8
            17
            21
            25
          gradle-no-cache-if: true

      - name: Setup properties
        run: |
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64" >> gradle.properties

      - name: Build with Gradle
        run: |
          ./gradlew build -PmcVer="${{ matrix.mc }}" -Pnull2264.platform="${{ matrix.loader }}"
        env:
          VERSION: ${{ github.event.inputs.version == '' && '0.0.0' || github.event.inputs.version }}

      - name: Archive build results
        run: tar -I zstd -cf build.tar.zst cobblegen/build/libs/*

      - name: Upload build folder
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-mc${{ matrix.mc }}-${{ matrix.loader }}
          path: build.tar.zst
          if-no-files-found: error
          retention-days: 3

      - name: Upload jar files
        uses: actions/upload-artifact@v4
        with:
          name: jar-mc${{ matrix.mc }}-${{ matrix.loader }}
          path: cobblegen/build/libs/*
          if-no-files-found: error
          retention-days: 3

      - name: GameTest with Gradle
        if: github.event.inputs.bypass-test != 'true' && matrix.mc != '1.16.5'
        run: |
          echo "# GameTest results" >> $GITHUB_STEP_SUMMARY;
          echo "<table>" >> $GITHUB_STEP_SUMMARY;
          echo "<tr>" >> $GITHUB_STEP_SUMMARY;
          echo "<th>Status</th>" >> $GITHUB_STEP_SUMMARY;
          echo "</tr>" >> $GITHUB_STEP_SUMMARY;

          timeout 20m ./gradlew runGametest -PmcVer="${{ matrix.mc }}" -Pnull2264.platform="${{ matrix.loader }}" && (
              echo "<tr>" >> $GITHUB_STEP_SUMMARY;
              echo "<td>🟩 Complete</td>" >> $GITHUB_STEP_SUMMARY;
              echo "</tr>" >> $GITHUB_STEP_SUMMARY;
            ) || (
              EXIT_CODE="$?"
              echo "<tr>" >> $GITHUB_STEP_SUMMARY;
              STATUS="Unknown error ($EXIT_CODE)";

              case "$EXIT_CODE" in
                "-1")
                  STATUS="🟥 Test failed"
                  ;;
                "125" | "124")
                  STATUS="🟨 Timed out"
                  ;;
                "255" | "1")
                  STATUS="🟥 Crashed"
                  ;;
                *)
                  ;;
              esac

              echo "<td>$STATUS</td>" >> $GITHUB_STEP_SUMMARY;
              echo "</tr>" >> $GITHUB_STEP_SUMMARY;

              case "$EXIT_CODE" in
                "255" | "1")
                  echo "</table>" >> $GITHUB_STEP_SUMMARY
                  exit $EXIT_CODE
                  ;;
                *)
                  ;;
              esac
            )

        env:
          VERSION: ${{ github.event.inputs.version == '' && '0.0.0' || github.event.inputs.version }}

      - name: Download build artifact
        if: github.event.inputs.bypass-test != 'true'
        uses: actions/download-artifact@v4
        with:
          name: runtime-test-kit

      - name: Setup HeadlessMC
        if: github.event.inputs.bypass-test != 'true' && matrix.mc != '1.16.5'
        id: setup-headlessmc
        run: |
          mkdir -p HeadlessMC run/test-${{ matrix.mc }}-${{ matrix.loader }}/mods run/test-${{ matrix.mc }}-${{ matrix.loader }}/config

          cat <<EOF >> HeadlessMC/config.properties
          hmc.java.versions=$JAVA_HOME_${{ matrix.java }}_X64
          hmc.files.game=$PWD/run/test-${{ matrix.mc }}-${{ matrix.loader }}
          hmc.files.game-for-each-version=false
          hmc.files.mc=$HOME/.minecraft
          hmc.jline.enabled=false
          hmc.launcher.crash-report-watcher=true
          EOF

          cat <<EOF >> run/test-${{ matrix.mc }}-${{ matrix.loader }}/options.txt
          onboardAccessibility:false
          pauseOnLostFocus:false
          EOF

          echo "HMC_FILES_LOCATION=$PWD/HeadlessMC" >> "$GITHUB_ENV"

          json="$(cat ./headlessmc.json)"
          url="$(echo $json | jq -r '.assets[].browser_download_url' | grep .jar | grep -v jfx | grep -v lwjgl)"
          curl -fLs -o "headlessmc-launcher.jar" $url

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y x11-xserver-utils

      - name: Tests with HeadlessMC
        if: github.event.inputs.bypass-test != 'true' && matrix.mc != '1.16.5'
        env:
          ENABLE_NULL2264_COBBLEGEN_GAMETEST: true
        run: |
          VERSION=v4.45.1
          BINARY=yq_linux_amd64
          wget https://github.com/mikefarah/yq/releases/download/${VERSION}/${BINARY}.tar.gz -O - |\
            tar xz && sudo mv ${BINARY} /usr/bin/yq

          case "${{ matrix.loader }}" in
            fabric)   loader_label="L" ;;
            forge)    loader_label="F" ;;
            neoforge) loader_label="N" ;;
            *)        loader_label="I" ;;
          esac

          cp cobblegen/build/libs/cobblegen-*+${{ matrix.mc }}*XB${loader_label}.jar run/test-${{ matrix.mc }}-${{ matrix.loader }}/mods

          echo "# [$(echo "${{ matrix.loader }}" | tr '[:lower:]' '[:upper:]') - ${{ matrix.mc }}] Test results" >> $GITHUB_STEP_SUMMARY;
          echo "<table>" >> $GITHUB_STEP_SUMMARY;
          echo "<tr>" >> $GITHUB_STEP_SUMMARY;
          echo "<th>Runtime Version</th><th>Status</th>" >> $GITHUB_STEP_SUMMARY;
          echo "</tr>" >> $GITHUB_STEP_SUMMARY;

          echo "[TEST] Initializing..."
          TEST_VERSIONS=(${{ join(matrix.testVersions, ' ') }})
          for i in "${TEST_VERSIONS[@]}"; do
            echo "[TEST] Testing MC $i (${{ matrix.loader }})..."

            #region Download MC Runtime Test Mod
            RUNTIME_VERSION="5.1.0"
            echo "[TEST] Downloading Runtime Test Mod... [1/3]"

            TARGET=$i
            url="https://github.com/headlesshq/mc-runtime-test-mod/releases/download/${TARGET}-${RUNTIME_VERSION}/mc-runtime-test-${TARGET}-${{ matrix.loader }}-${RUNTIME_VERSION}.jar"

            echo "[TEST] Downloading Runtime Test Mod... [2/3]"

            tries=1
            SLEEP_DURATION=1
            success=0
            while [ $tries -le 5 ];
            do
              curl -fsSL -o "mc-runtime-test.jar" $url && success=1 && break
              echo "[TEST] Failed to download Runtime Test Mod, retrying in $SLEEP_DURATION seconds... [$tries/5]"
              tries=$((tries+1))
              sleep $SLEEP_DURATION
              SLEEP_DURATION=$((SLEEP_DURATION+SLEEP_DURATION))
            done

            [ "$success" = "0" ] && (
              echo "[TEST] Unable to download Runtime Test Mod"
              exit 1
            )

            echo "[TEST] Downloading Runtime Test Mod... [3/3]"
            mv -f ./mc-runtime-test.jar run/test-${{ matrix.mc }}-${{ matrix.loader }}/mods
            #endregion

            [ "${{ matrix.loader }}" = "fabric" ] && (
              fapi="$(yq -M ".[\"$i\"]" fabric-versions.yaml || echo 'null')"
              [ "$fapi" = "null" ] || (
                url="https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$fapi+$i/fabric-api-$fapi+$i.jar"
                curl -fsSL -o "fapi.jar" $url
                mv -f ./fapi.jar run/test-${{ matrix.mc }}-${{ matrix.loader }}/mods
              )

              gametest="$(yq -M ".[\"$i\"]" fabric-gametest-versions.yaml || echo 'null')"
              [ "$gametest" = "null" ] || (
                rm -f run/test-${{ matrix.mc }}-${{ matrix.loader }}/mods/fapi-resource.jar

                resource="$(yq -M ".[\"$i\"]" fabric-resource-versions.yaml || echo 'null')"
                [ "$resource" = "null" ] || (
                  url="https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-resource-loader-v0/$resource/fabric-resource-loader-v0-$resource.jar"
                  curl -fsSL -o "fapi-resource.jar" $url
                  mv -f ./fapi-resource.jar run/test-${{ matrix.mc }}-${{ matrix.loader }}/mods
                )

                url="https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-gametest-api-v1/$gametest/fabric-gametest-api-v1-$gametest.jar"
                curl -fsSL -o "fapi-gametest.jar" $url
                mv -f ./fapi-gametest.jar run/test-${{ matrix.mc }}-${{ matrix.loader }}/mods
              )
            )

            HMC_JVM_OPTIONS="-Djava.awt.headless=true -DMcRuntimeGameTestMinExpectedGameTests=1 -DMcRuntimeGameTestNamespaces=cobblegen -Dnull2264.cobblegen.gametest=true"
            grep "forge" <<< "${{ matrix.loader }}" && (
              # Needed this because FML is dogshit
              echo "[TEST] Adding java agent to (Neo)Forge";
              curl -fsSL -O https://github.com/void-community/ModLoaderFixes/releases/latest/download/modloaderfixes.jar;
              HMC_JVM_OPTIONS="-javaagent:$PWD/modloaderfixes.jar $HMC_JVM_OPTIONS";
            )
            echo "[TEST] Downloading MC and Mod Loader..."
            java -jar ./headlessmc-launcher.jar version install ${{ matrix.loader }} $i
            echo "[TEST] Launching MC Headless..."
            timeout 20m xvfb-run  -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" java -Dhmc.check.xvfb=true -jar ./headlessmc-launcher.jar launch --offline --retries 3 --jvm "${HMC_JVM_OPTIONS}" ${{ matrix.loader }} $i && (
              echo "[TEST] Test complete ($i)"; true;
              echo "<tr>" >> $GITHUB_STEP_SUMMARY;
              echo "<td>$i</td><td>🟩 Complete</td>" >> $GITHUB_STEP_SUMMARY;
              echo "</tr>" >> $GITHUB_STEP_SUMMARY;
            ) || (
              EXIT_CODE="$?"
              echo "[TEST] Test failed or timed out ($i)"; true;
              echo "<tr>" >> $GITHUB_STEP_SUMMARY;
              STATUS="Unknown error ($EXIT_CODE)";

              case "$EXIT_CODE" in
                "-1")
                  STATUS="🟥 Test failed"
                  ;;
                "125" | "124")
                  STATUS="🟨 Timed out"
                  ;;
                "255" | "1")
                  STATUS="🟥 Crashed"
                  ;;
                *)
                  ;;
              esac

              echo "<td>$i</td><td>$STATUS</td>" >> $GITHUB_STEP_SUMMARY;
              echo "</tr>" >> $GITHUB_STEP_SUMMARY;

              case "$EXIT_CODE" in
                "255" | "1")
                  echo "</table>" >> $GITHUB_STEP_SUMMARY
                  exit $EXIT_CODE
                  ;;
                *)
                  ;;
              esac
            )
          done
          echo "</table>" >> $GITHUB_STEP_SUMMARY;

      - name: Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' && github.event.inputs.bypass-mod-publish != 'true'
        shell: bash
        run: |
          ./gradlew publishMods -PmcVer="${{ matrix.mc }}" -Pnull2264.platform="${{ matrix.loader }}"
        env:
          VERSION: ${{ github.event.inputs.version == '' && '0.0.0' || github.event.inputs.version }}
          CHANGELOG: ${{ needs.setup.outputs.changelog }}
          CURSEFORGE: ${{ secrets.CURSEFORGE }}
          MODRINTH: ${{ secrets.MODRINTH }}

  release:
    name: Release to GitHub
    needs: [setup, build]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' && github.event.inputs.bypass-mod-publish != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup CHANGELOG parser
        uses: taiki-e/install-action@parse-changelog

      - name: Merge build artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: build-artifacts
          pattern: build-artifacts-*
          delete-merged: true

      - name: Merge jar artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: jars
          pattern: jar-*
          delete-merged: true

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: jars

      - name: Deploy to GitHub
        if: needs.setup.outputs.changelog != ''
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{github.event.inputs.version}}
          name: v${{github.event.inputs.version}}
          body: |
            ${{ needs.setup.outputs.changelog }}
          files: |
            ./!(*-dev-shade|*-sources|*-raw).jar
